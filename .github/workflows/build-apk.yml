name: Build TejiMusic Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleDebug --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/TejiMusic-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TejiMusic-Android-APK
          path: dist/TejiMusic-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "TejiMusic Android APK v1.0.0"
          body: |
            ### 📱 TejiMusic Android APK Release
            Official Android APK for **TejiMusic**.
            
            - **Download**: Click `TejiMusic-v1.0.apk` below to download and install directly on your Android phone!
            - **Features**: 
              - Pure 320kbps HD Audio
              - Punjabi Bhangra (Year-Wise Filter: 2025 to 90s)
              - Punjabi Shabad Gurbani (Pure Devotional)
              - Bhai Ranjit Singh Ji Dhadrianwale (Full Diwans & Kathas)
              - Haryanvi Hits
              - Sleeping Music & Deep Relaxation
              - Background playback & Media Controls
          files: dist/TejiMusic-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
